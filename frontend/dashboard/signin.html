<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NeuroPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #161627;
            --primary-neon: #00f5ff;
            --secondary-neon: #ff00ff;
            --error-neon: #ff4444;
            --text-color: #e0e0e0;
            --glow-primary: 0 0 5px var(--primary-neon), 0 0 10px var(--primary-neon);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .signin-container {
            background: rgba(20, 20, 35, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-neon);
            text-shadow: var(--glow-primary);
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.7;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            background-color: rgba(10, 10, 26, 0.8);
            color: var(--text-color);
            font-size: 1rem;
            transition: box-shadow 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        .signin-btn {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
            margin-top: 10px;
        }

        .signin-btn:hover {
            box-shadow: 0 0 15px #ff00ff, 0 0 30px #00ffff;
            transform: scale(1.02);
        }
        
        #error-message {
            color: var(--error-neon);
            margin-top: 15px;
            height: 20px;
            font-size: 0.9rem;
            visibility: hidden;
        }

    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="signin-container">
        <div class="logo">NeuroPlay</div>
        <p class="tagline">Unlock Your Cognitive Potential</p>
        
        <form id="signin-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="signin-btn">Sign In</button>
        </form>
        
        <p id="error-message">Invalid credentials. Please try again.</p>
    </div>

    <script>
        // --- ANIMATED BACKGROUND LOGIC ---
        const bgCanvas = document.getElementById('bg-canvas');
        const ctx = bgCanvas.getContext('2d');

        let stars = [];
        const numStars = 100;
        const connectionDistance = 100;

        function setCanvasSize() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.radius = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.5;
                this.velocity = { x: (Math.random() - 0.5) * 0.2, y: (Math.random() - 0.5) * 0.2 };
                this.twinkleSpeed = Math.random() * 0.03;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
            update() {
                this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.05;
                if (this.alpha > 1) this.alpha = 1;
                if (this.alpha < 0.1) this.alpha = 0.1;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                if (this.x < 0 || this.x > bgCanvas.width) this.velocity.x *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.velocity.y *= -1;
                this.draw();
            }
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) { stars.push(new Star()); }
        }

        function drawConstellations() {
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const dist = Math.hypot(stars[i].x - stars[j].x, stars[i].y - stars[j].y);
                    if (dist < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        const opacity = 1 - (dist / connectionDistance);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.5})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            stars.forEach(star => star.update());
            drawConstellations();
        }

        setCanvasSize();
        createStars();
        animate();
        window.addEventListener('resize', () => { setCanvasSize(); createStars(); });

        // --- SIGN IN FORM LOGIC ---
        const form = document.getElementById('signin-form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent the form from actually submitting

            const username = form.username.value;
            const password = form.password.value;

            // Check against our hard-coded dummy user
            if (username === 'CookiePookie' && password === '12345') {
                // On success, redirect to the main dashboard
                // IMPORTANT: Make sure your dashboard file is named 'index.html'
                // and is in the same folder or adjust the path.
                window.location.href = 'index.html'; 
            } else {
                // On failure, show the error message
                errorMessage.style.visibility = 'visible';
            }
        });
    </script>
</body>
</html>
