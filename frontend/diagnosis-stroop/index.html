<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroop Task Game - Diagnosis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- **** FIX: Back button moved outside the main container **** -->
  <button class="back-btn" onclick="window.location.href='../dashboard/index.html'">⬅ Back</button>

  <div class="container">
    <!-- Instructions -->
    <div id="instructions" class="card">
      <h2>Stroop Task - Diagnosis</h2>
      <p>
        A word will appear in a random color.  
        <br>Click the button that matches the <strong>color</strong> of the word, not the word itself!  
        <br>You have 20 rounds. Try to be accurate and quick.  
      </p>
      <button class="start-btn">Start Game</button>
    </div>

    <!-- Game Area -->
    <div id="game" class="hidden">
      <h2 id="word-display">READY?</h2>
      <div class="btn-group" id="color-options"></div>
    </div>

    <!-- Results -->
    <div id="results" class="card hidden">
      <h2 id="performance-msg">Good Job!</h2>
      <p id="metrics"></p>
      <div class="modal-controls">
        <button class="start-btn" id="play-again-btn">Play Again</button>
        <a href="../dashboard/diagnosis_report.html" class="start-btn" id="view-report-btn">View Report</a>
      </div>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
